# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

parameters:
    env(HEYMAIL_SEND_QUOTA_PER_HOUR): '600'
    env(HEYMAIL_CAMPAIGN_QUOTA_PER_HOUR): '600'
    env(HEYMAIL_BOUNCE_HMAC_KEY_FILE): '/run/secrets/bounce_hmac_key'
    env(HEYMAIL_PUBLIC_IPV4): '127.0.0.1'
    env(HEYMAIL_CONSOLE_DOMAIN): 'console.example.invalid'

    env(OVH_DNS_ZONE): 'example.invalid'
    env(OVH_APPLICATION_KEY_FILE): '/run/secrets/ovh_application_key'
    env(OVH_APPLICATION_SECRET_FILE): '/run/secrets/ovh_application_secret'
    env(OVH_CONSUMER_KEY_FILE): '/run/secrets/ovh_consumer_key'

    env(DNS_VERIFY_HOST): 'fake-dns'
    env(DNS_VERIFY_PORT): '8053'
    env(DNS_VERIFY_TIMEOUT_MS): '2000'

    env(DKIM_PRIVATE_DIRECTORY): '/run/heymail-dkim'
    env(DKIM_SELECTOR): 'hm1'

    env(WEBHOOK_KEK_FILE): '/run/secrets/webhook_kek_v1'
    env(WEBHOOK_CA_FILE): ''
    env(WEBHOOK_PRIVATE_HOST_ALLOWLIST): ''

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'

    App\Query\MessageCursorCodec:
        arguments:
            $secret: '%kernel.secret%'

    App\Webhook\WebhookHttpClient:
        arguments:
            $caFile: '%env(string:WEBHOOK_CA_FILE)%'
            $privateHostAllowlist: '%env(string:WEBHOOK_PRIVATE_HOST_ALLOWLIST)%'

    App\Webhook\WebhookSecretCipher:
        arguments:
            $webhookKekFile: '%env(string:WEBHOOK_KEK_FILE)%'

    App\Mail\OutboundEmailPayloadCipher:
        arguments:
            $payloadKekFile: '%env(string:PAYLOAD_KEK_FILE)%'

    App\Campaign\CampaignSnapshotCipher:
        arguments:
            $payloadKekFile: '%env(string:PAYLOAD_KEK_FILE)%'

    App\Mail\BounceAddressCodec:
        arguments:
            $bounceDomain: '%env(string:HEYMAIL_BOUNCE_DOMAIN)%'
            $hmacKeyFile: '%env(string:HEYMAIL_BOUNCE_HMAC_KEY_FILE)%'

    App\Mail\OutboundMessageSubmitter:
        alias: App\Mail\SymfonyMailerOutboundMessageSubmitter

    App\Mail\PostfixDeliveryLogParser:
        arguments:
            $bounceDomain: '%env(string:HEYMAIL_BOUNCE_DOMAIN)%'

    App\Dns\OvhApiClient:
        arguments:
            $applicationKeyFile: '%env(string:OVH_APPLICATION_KEY_FILE)%'
            $applicationSecretFile: '%env(string:OVH_APPLICATION_SECRET_FILE)%'
            $consumerKeyFile: '%env(string:OVH_CONSUMER_KEY_FILE)%'

    App\Dns\OvhDnsPublisher:
        arguments:
            $zone: '%env(string:OVH_DNS_ZONE)%'
            $consoleDomain: '%env(string:HEYMAIL_CONSOLE_DOMAIN)%'
            $bounceDomain: '%env(string:HEYMAIL_BOUNCE_DOMAIN)%'
            $publicIpv4: '%env(string:HEYMAIL_PUBLIC_IPV4)%'

    App\Api\ApiSendQuotaLimiter:
        arguments:
            $limitPerHour: '%env(int:HEYMAIL_SEND_QUOTA_PER_HOUR)%'

    App\Campaign\CampaignQuotaLimiter:
        arguments:
            $limitPerHour: '%env(int:HEYMAIL_CAMPAIGN_QUOTA_PER_HOUR)%'

    App\Api\ApiCredentials:
        arguments:
            $apiKeyFile: '%env(string:HEYMAIL_API_KEY_FILE)%'
            $apiSecretFile: '%env(string:HEYMAIL_API_SECRET_FILE)%'

    App\Mail\UdpDnsTxtRecordResolver:
        arguments:
            $host: '%env(string:DNS_VERIFY_HOST)%'
            $port: '%env(int:DNS_VERIFY_PORT)%'
            $timeoutMilliseconds: '%env(int:DNS_VERIFY_TIMEOUT_MS)%'

    App\Mail\TxtRecordResolver:
        alias: App\Mail\UdpDnsTxtRecordResolver

    App\Mail\DkimKeyProvisioner:
        arguments:
            $privateDirectory: '%env(string:DKIM_PRIVATE_DIRECTORY)%'
            $selector: '%env(string:DKIM_SELECTOR)%'
