[www]

user = heymail
group = heymail

; PHP-FPM is reachable only through the shared Unix socket.
; No FastCGI TCP listener exists.
listen = /run/heymail-fpm/heymail.sock
listen.mode = 0660

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

catch_workers_output = yes
decorate_workers_output = no

; Never inherit the full container environment.
clear_env = yes

; Explicit application runtime whitelist.
env[APP_ENV] = $APP_ENV
env[APP_DEBUG] = $APP_DEBUG
env[APP_RUNTIME_OPTIONS] = $APP_RUNTIME_OPTIONS
env[APP_SECRET_FILE] = $APP_SECRET_FILE

env[DEFAULT_URI] = $DEFAULT_URI

env[DB_HOST] = $DB_HOST
env[DB_PORT] = $DB_PORT
env[DB_NAME] = $DB_NAME
env[DB_USER] = $DB_USER
env[DB_PASSWORD_FILE] = $DB_PASSWORD_FILE

env[MAILER_DSN] = $MAILER_DSN
env[HEYMAIL_BOUNCE_DOMAIN] = $HEYMAIL_BOUNCE_DOMAIN

env[PAYLOAD_KEK_FILE] = $PAYLOAD_KEK_FILE

env[HEYMAIL_API_KEY_FILE] = $HEYMAIL_API_KEY_FILE
env[HEYMAIL_API_SECRET_FILE] = $HEYMAIL_API_SECRET_FILE
