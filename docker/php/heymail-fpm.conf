[www]

; The whole container runs as the unprivileged heymail user.
user = heymail
group = heymail

; Until a dedicated reverse proxy is introduced, FastCGI is intentionally
; reachable only from inside this container.
listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

catch_workers_output = yes
decorate_workers_output = no

; Do not inherit the container environment blindly.
clear_env = yes

; Explicit whitelist.
; No secret VALUE is stored in these variables: only paths to secret files.
env[APP_ENV] = $APP_ENV
env[APP_DEBUG] = $APP_DEBUG
env[APP_RUNTIME_OPTIONS] = $APP_RUNTIME_OPTIONS
env[APP_SECRET_FILE] = $APP_SECRET_FILE

env[DB_HOST] = $DB_HOST
env[DB_PORT] = $DB_PORT
env[DB_NAME] = $DB_NAME
env[DB_USER] = $DB_USER
env[DB_PASSWORD_FILE] = $DB_PASSWORD_FILE
