worker_processes auto;

pid /tmp/nginx.pid;

error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;

    default_type application/octet-stream;

    access_log /dev/stdout combined;

    server_tokens off;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    ssl_certificate
        /run/secrets/gateway_tls_cert;

    ssl_certificate_key
        /run/secrets/gateway_tls_key;

    server {
        listen 8443 ssl default_server;
        server_name _;

        return 444;
    }

    server {
        listen 8443 ssl;
        server_name api.heymail.test;

        client_max_body_size 3500k;

        add_header
            X-Content-Type-Options
            nosniff
            always;

        add_header
            X-Frame-Options
            DENY
            always;

        add_header
            Referrer-Policy
            no-referrer
            always;

        add_header
            Cache-Control
            "no-store"
            always;

        location = /gateway-health {
            access_log off;
            return 204;
        }

        location / {
            include /etc/nginx/fastcgi_params;

            # Symfony may emit its own Cache-Control policy.
            # The public API boundary enforces a single no-store policy.
            fastcgi_hide_header Cache-Control;

            fastcgi_param
                SCRIPT_FILENAME
                /app/public/index.php;

            fastcgi_param
                SCRIPT_NAME
                /index.php;

            fastcgi_param
                DOCUMENT_ROOT
                /app/public;

            fastcgi_param
                HTTPS
                on;

            fastcgi_param
                REQUEST_SCHEME
                https;

            fastcgi_param
                SERVER_PORT
                8443;

            fastcgi_param
                HTTP_HOST
                $host;

            fastcgi_param
                HTTP_AUTHORIZATION
                $http_authorization;

            fastcgi_param
                HTTP_IDEMPOTENCY_KEY
                $http_idempotency_key;

            fastcgi_param
                HTTP_ACCEPT
                $http_accept;

            fastcgi_connect_timeout 3s;
            fastcgi_read_timeout 30s;

            fastcgi_pass
                unix:/run/heymail-fpm/heymail.sock;
        }
    }
}
