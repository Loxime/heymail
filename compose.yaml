name: heymail

services:

  # =========================================================================
  # PostgreSQL
  # =========================================================================

  database:
    image: postgres:18.4-alpine3.23@sha256:996d0920e4ff9df1fc19dacb904492f3c1ec0ec1cc338f0ad7123be7731c5f5e

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}

      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password

      POSTGRES_INITDB_ARGS: >-
        --auth-host=scram-sha-256
        --auth-local=scram-sha-256
        --encoding=UTF8
        --locale-provider=builtin
        --builtin-locale=C.UTF-8

    secrets:
      - postgres_password

    volumes:
      - postgres_data:/var/lib/postgresql

    networks:
      - data_net

    expose:
      - "5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

    security_opt:
      - no-new-privileges:true

    read_only: true

    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/run/postgresql:size=16m,mode=3777

    pids_limit: 200
    mem_limit: 768m
    cpus: 1.0

    stop_grace_period: 30s


  # =========================================================================
  # PostgreSQL bootstrap
  #
  # Short-lived provisioning service.
  # It creates/updates the limited application and migration roles.
  # =========================================================================

  database-bootstrap:
    image: postgres:18.4-alpine3.23@sha256:996d0920e4ff9df1fc19dacb904492f3c1ec0ec1cc338f0ad7123be7731c5f5e

    restart: "no"

    user: "${HEYMAIL_UID:?HEYMAIL_UID is required}:${HEYMAIL_GID:?HEYMAIL_GID is required}"

    entrypoint:
      - /bin/sh
      - /opt/heymail/bootstrap-roles.sh

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}

      PGHOST: database
      PGPORT: "5432"

    secrets:
      - postgres_password
      - postgres_app_password
      - postgres_migrator_password

    volumes:
      - ./docker/postgres/bootstrap/bootstrap-roles.sh:/opt/heymail/bootstrap-roles.sh:ro

    networks:
      - data_net

    depends_on:
      database:
        condition: service_healthy

    read_only: true

    tmpfs:
      - /tmp:size=16m,mode=1777

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    pids_limit: 50
    mem_limit: 128m
    cpus: 0.25


  # =========================================================================
  # Symfony API
  # =========================================================================

  api:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        HEYMAIL_UID: ${HEYMAIL_UID:?HEYMAIL_UID is required}
        HEYMAIL_GID: ${HEYMAIL_GID:?HEYMAIL_GID is required}

    image: heymail-api:local

    restart: unless-stopped

    user: "${HEYMAIL_UID:?HEYMAIL_UID is required}:${HEYMAIL_GID:?HEYMAIL_GID is required}"

    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      DEFAULT_URI: "https://api.heymail.test"
      APP_RUNTIME_OPTIONS: '{"disable_dotenv":true}'
      APP_SECRET_FILE: /run/secrets/app_secret
      MAILER_DSN: "null://null"
      HEYMAIL_BOUNCE_DOMAIN: "heymail.test"
      PAYLOAD_KEK_FILE: /run/secrets/payload_kek_v1
      WEBHOOK_KEK_FILE: /run/secrets/webhook_kek_v1
      HEYMAIL_API_KEY_FILE: /run/secrets/api_key
      HEYMAIL_API_SECRET_FILE: /run/secrets/api_secret

      DB_HOST: database
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:?POSTGRES_DB is required}
      DB_USER: heymail_app
      DB_PASSWORD_FILE: /run/secrets/postgres_app_password

    secrets:
      - app_secret
      - postgres_app_password
      - payload_kek_v1
      - webhook_kek_v1
      - api_key
      - api_secret

    volumes:
      - api_fpm_socket:/run/heymail-fpm

    networks:
      - data_net

    depends_on:
      database:
        condition: service_healthy

      database-bootstrap:
        condition: service_completed_successfully

      fpm-socket-bootstrap:
        condition: service_completed_successfully

    read_only: true

    tmpfs:
      - /tmp:size=32m,mode=1777
      - /app/var:size=128m,mode=0770,uid=${HEYMAIL_UID},gid=${HEYMAIL_GID}

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    pids_limit: 100
    mem_limit: 384m
    cpus: 0.50

    healthcheck:
      test:
        [
          "CMD",
          "php",
          "/usr/local/bin/heymail-healthcheck.php"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    stop_grace_period: 15s


  # =========================================================================
  # Outbound mail worker
  #
  # Consumes the Doctrine Messenger outbound queue.
  # It reaches Postfix only through the isolated internal mail network.
  # =========================================================================

  mail-worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        HEYMAIL_UID: ${HEYMAIL_UID:?HEYMAIL_UID is required}
        HEYMAIL_GID: ${HEYMAIL_GID:?HEYMAIL_GID is required}

    image: heymail-api:local

    restart: unless-stopped

    user: "${HEYMAIL_UID:?HEYMAIL_UID is required}:${HEYMAIL_GID:?HEYMAIL_GID is required}"

    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      DEFAULT_URI: "https://api.heymail.test"
      APP_RUNTIME_OPTIONS: '{"disable_dotenv":true}'
      APP_SECRET_FILE: /run/secrets/app_secret
      MAILER_DSN: "smtp://postfix-mail:10025"
      HEYMAIL_BOUNCE_DOMAIN: "heymail.test"
      PAYLOAD_KEK_FILE: /run/secrets/payload_kek_v1

      DB_HOST: database
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:?POSTGRES_DB is required}
      DB_USER: heymail_app
      DB_PASSWORD_FILE: /run/secrets/postgres_app_password

    secrets:
      - app_secret
      - postgres_app_password
      - payload_kek_v1

    networks:
      - data_net
      - mail_net

    depends_on:
      database:
        condition: service_healthy

      database-bootstrap:
        condition: service_completed_successfully

    read_only: true

    tmpfs:
      - /tmp:size=32m,mode=1777
      - /app/var:size=64m,mode=0770,uid=${HEYMAIL_UID},gid=${HEYMAIL_GID}

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    pids_limit: 100
    mem_limit: 384m
    cpus: 0.50

    command:
      - php
      - bin/console
      - messenger:consume
      - outbound
      - --time-limit=3600
      - --memory-limit=192M
      - --sleep=1
      - --no-interaction

    stop_grace_period: 30s


  # =========================================================================
  # Postfix delivery feedback observer
  #
  # Reads only the dedicated Postfix log volume and persists delivery events.
  # It has database access but no SMTP, filter, DNS or gateway network.
  # =========================================================================

  delivery-observer:
    image: heymail-api:local

    restart: unless-stopped

    user: "${HEYMAIL_UID:?HEYMAIL_UID is required}:${HEYMAIL_GID:?HEYMAIL_GID is required}"

    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      DEFAULT_URI: "https://api.heymail.test"
      APP_RUNTIME_OPTIONS: '{"disable_dotenv":true}'
      APP_SECRET_FILE: /run/secrets/app_secret
      MAILER_DSN: "null://null"
      HEYMAIL_BOUNCE_DOMAIN: "heymail.test"

      DB_HOST: database
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:?POSTGRES_DB is required}
      DB_USER: heymail_app
      DB_PASSWORD_FILE: /run/secrets/postgres_app_password

    secrets:
      - app_secret
      - postgres_app_password

    volumes:
      - postfix_logs:/var/log/postfix:ro

    networks:
      - data_net

    depends_on:
      database:
        condition: service_healthy

      database-bootstrap:
        condition: service_completed_successfully

      postfix:
        condition: service_healthy

    read_only: true

    tmpfs:
      - /tmp:size=16m,mode=1777
      - /app/var:size=32m,mode=0770,uid=${HEYMAIL_UID},gid=${HEYMAIL_GID}

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    pids_limit: 50
    mem_limit: 192m
    cpus: 0.25

    command:
      - php
      - bin/console
      - app:observe-postfix-delivery
      - --file=/var/log/postfix/heymail.log


  # =========================================================================
  # Webhook transactional outbox relay
  #
  # Database-only component. It cannot reach webhook targets.
  # =========================================================================

  webhook-outbox:
    image: heymail-api:local

    restart: unless-stopped

    user: "${HEYMAIL_UID:?HEYMAIL_UID is required}:${HEYMAIL_GID:?HEYMAIL_GID is required}"

    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      DEFAULT_URI: "https://api.heymail.test"
      APP_RUNTIME_OPTIONS: '{"disable_dotenv":true}'
      APP_SECRET_FILE: /run/secrets/app_secret
      MAILER_DSN: "null://null"

      DB_HOST: database
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:?POSTGRES_DB is required}
      DB_USER: heymail_app
      DB_PASSWORD_FILE: /run/secrets/postgres_app_password

    secrets:
      - app_secret
      - postgres_app_password

    networks:
      - data_net

    depends_on:
      database:
        condition: service_healthy

      database-bootstrap:
        condition: service_completed_successfully

    read_only: true

    tmpfs:
      - /tmp:size=16m,mode=1777
      - /app/var:size=32m,mode=0770,uid=${HEYMAIL_UID},gid=${HEYMAIL_GID}

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    pids_limit: 50
    mem_limit: 192m
    cpus: 0.25

    command:
      - php
      - bin/console
      - app:webhook-outbox
      - --batch=50
      - --sleep-ms=1000


  # =========================================================================
  # HTTPS webhook receiver laboratory
  # =========================================================================

  fake-webhook:
    image: heymail-api:local

    restart: unless-stopped

    user: "${HEYMAIL_UID:?HEYMAIL_UID is required}:${HEYMAIL_GID:?HEYMAIL_GID is required}"

    environment:
      FAKE_WEBHOOK_CERT_FILE: /run/secrets/gateway_tls_cert
      FAKE_WEBHOOK_KEY_FILE: /run/secrets/gateway_tls_key

    secrets:
      - gateway_tls_cert
      - gateway_tls_key

    networks:
      webhook_net:
        aliases:
          - api.heymail.test

    volumes:
      - ./docker/webhook-lab/server.php:/opt/heymail/webhook-lab.php:ro

    read_only: true

    tmpfs:
      - /tmp:size=8m,mode=1777
      - /capture:size=16m,mode=0700,uid=${HEYMAIL_UID},gid=${HEYMAIL_GID}

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    pids_limit: 30
    mem_limit: 64m
    cpus: 0.10

    command:
      - php
      - /opt/heymail/webhook-lab.php

    healthcheck:
      test:
        [
          "CMD",
          "test",
          "-f",
          "/capture/ready"
        ]
      interval: 2s
      timeout: 1s
      retries: 10
      start_period: 2s


  # =========================================================================
  # Signed webhook delivery worker
  #
  # Only this component may decrypt webhook signing secrets and perform
  # outbound webhook HTTPS connections.
  # =========================================================================

  webhook-worker:
    image: heymail-api:local

    restart: unless-stopped

    user: "${HEYMAIL_UID:?HEYMAIL_UID is required}:${HEYMAIL_GID:?HEYMAIL_GID is required}"

    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      DEFAULT_URI: "https://api.heymail.test"
      APP_RUNTIME_OPTIONS: '{"disable_dotenv":true}'
      APP_SECRET_FILE: /run/secrets/app_secret
      MAILER_DSN: "null://null"
      WEBHOOK_KEK_FILE: /run/secrets/webhook_kek_v1

      DB_HOST: database
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:?POSTGRES_DB is required}
      DB_USER: heymail_app
      DB_PASSWORD_FILE: /run/secrets/postgres_app_password

    secrets:
      - app_secret
      - postgres_app_password
      - webhook_kek_v1

    networks:
      - data_net
      - webhook_net

    depends_on:
      database:
        condition: service_healthy

      database-bootstrap:
        condition: service_completed_successfully

    read_only: true

    tmpfs:
      - /tmp:size=16m,mode=1777
      - /app/var:size=32m,mode=0770,uid=${HEYMAIL_UID},gid=${HEYMAIL_GID}

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    pids_limit: 50
    mem_limit: 192m
    cpus: 0.25

    command:
      - php
      - bin/console
      - messenger:consume
      - webhook_delivery
      - --time-limit=3600
      - --memory-limit=128M
      - --sleep=1
      - --no-interaction

    stop_grace_period: 15s


  # =========================================================================
  # Sending-domain DNS ownership worker
  #
  # Consumes only DNS verification jobs.
  # It can reach PostgreSQL and the isolated DNS laboratory, but never the
  # SMTP, filter or public gateway networks.
  # =========================================================================

  domain-verifier:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        HEYMAIL_UID: ${HEYMAIL_UID:?HEYMAIL_UID is required}
        HEYMAIL_GID: ${HEYMAIL_GID:?HEYMAIL_GID is required}

    image: heymail-api:local

    restart: unless-stopped

    user: "${HEYMAIL_UID:?HEYMAIL_UID is required}:${HEYMAIL_GID:?HEYMAIL_GID is required}"

    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      DEFAULT_URI: "https://api.heymail.test"
      APP_RUNTIME_OPTIONS: '{"disable_dotenv":true}'
      APP_SECRET_FILE: /run/secrets/app_secret
      MAILER_DSN: "null://null"
      HEYMAIL_BOUNCE_DOMAIN: "heymail.test"

      DNS_VERIFY_HOST: fake-dns
      DNS_VERIFY_PORT: "8053"
      DNS_VERIFY_TIMEOUT_MS: "2000"

      DB_HOST: database
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:?POSTGRES_DB is required}
      DB_USER: heymail_app
      DB_PASSWORD_FILE: /run/secrets/postgres_app_password

    secrets:
      - app_secret
      - postgres_app_password

    networks:
      - data_net
      - dns_lab_net

    depends_on:
      database:
        condition: service_healthy

      database-bootstrap:
        condition: service_completed_successfully

      fake-dns:
        condition: service_healthy

    read_only: true

    tmpfs:
      - /tmp:size=32m,mode=1777
      - /app/var:size=64m,mode=0770,uid=${HEYMAIL_UID},gid=${HEYMAIL_GID}

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    pids_limit: 100
    mem_limit: 256m
    cpus: 0.50

    command:
      - php
      - bin/console
      - messenger:consume
      - domain_verification
      - --time-limit=3600
      - --memory-limit=128M
      - --sleep=1
      - --no-interaction

    stop_grace_period: 15s


  # =========================================================================
  # Per-domain DKIM key provisioner
  #
  # This worker owns the dynamic private-key directory and PostgreSQL state.
  # It has no SMTP, DNS, filter, gateway or Internet-facing network.
  #
  # UID 10004 owns dynamic keys.
  # GID 101 is shared read-only with Rspamd.
  # =========================================================================

  dkim-provisioner:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        HEYMAIL_UID: ${HEYMAIL_UID:?HEYMAIL_UID is required}
        HEYMAIL_GID: ${HEYMAIL_GID:?HEYMAIL_GID is required}

    image: heymail-api:local

    restart: unless-stopped

    user: "1000:101"
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      DEFAULT_URI: "https://api.heymail.test"
      APP_RUNTIME_OPTIONS: '{"disable_dotenv":true}'
      APP_SECRET_FILE: /run/secrets/app_secret
      MAILER_DSN: "null://null"
      HEYMAIL_BOUNCE_DOMAIN: "heymail.test"

      DKIM_PRIVATE_DIRECTORY: /run/heymail-dkim
      DKIM_SELECTOR: hm1

      DB_HOST: database
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:?POSTGRES_DB is required}
      DB_USER: heymail_app
      DB_PASSWORD_FILE: /run/secrets/postgres_app_password

    secrets:
      - app_secret
      - postgres_app_password

    volumes:
      - rspamd_dkim_private:/run/heymail-dkim

    networks:
      - data_net

    depends_on:
      database:
        condition: service_healthy

      database-bootstrap:
        condition: service_completed_successfully

      rspamd-dkim-bootstrap:
        condition: service_completed_successfully

    read_only: true

    tmpfs:
      - /tmp:size=32m,mode=1777
      - /app/var:size=64m,uid=10004,gid=101,mode=0770

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    pids_limit: 100
    mem_limit: 384m
    cpus: 0.50

    command:
      - php
      - bin/console
      - messenger:consume
      - dkim_provisioning
      - --time-limit=3600
      - --memory-limit=128M
      - --sleep=1
      - --no-interaction

    stop_grace_period: 15s


  # =========================================================================
  # Doctrine database migrations
  #
  # Short-lived service using the restricted migration role.
  # =========================================================================

  database-migrate:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        HEYMAIL_UID: ${HEYMAIL_UID:?HEYMAIL_UID is required}
        HEYMAIL_GID: ${HEYMAIL_GID:?HEYMAIL_GID is required}

    image: heymail-api:local

    restart: "no"

    user: "${HEYMAIL_UID:?HEYMAIL_UID is required}:${HEYMAIL_GID:?HEYMAIL_GID is required}"

    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      DEFAULT_URI: "https://api.heymail.test"
      APP_RUNTIME_OPTIONS: '{"disable_dotenv":true}'
      APP_SECRET_FILE: /run/secrets/app_secret
      MAILER_DSN: "null://null"
      HEYMAIL_BOUNCE_DOMAIN: "heymail.test"

      DB_HOST: database
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:?POSTGRES_DB is required}
      DB_USER: heymail_migrator
      DB_PASSWORD_FILE: /run/secrets/postgres_migrator_password

    secrets:
      - app_secret
      - postgres_migrator_password

    networks:
      - data_net

    depends_on:
      database:
        condition: service_healthy

      database-bootstrap:
        condition: service_completed_successfully

    read_only: true

    tmpfs:
      - /tmp:size=32m,mode=1777
      - /app/var:size=64m,mode=0770,uid=${HEYMAIL_UID},gid=${HEYMAIL_GID}

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    pids_limit: 100
    mem_limit: 384m
    cpus: 0.50

    entrypoint:
      - php
      - bin/console
      - doctrine:migrations:migrate
      - --no-interaction
      - --allow-no-migration


  # =========================================================================
  # PHP-FPM socket bootstrap
  # =========================================================================

  fpm-socket-bootstrap:
    image: heymail-api:local

    restart: "no"

    user: "0:0"

    network_mode: "none"

    read_only: true

    entrypoint:
      - /bin/sh
      - -ec

    command:
      - >-
        chmod 0770 /run/heymail-fpm
        && chown ${HEYMAIL_UID:?HEYMAIL_UID is required}:${HEYMAIL_GID:?HEYMAIL_GID is required}
        /run/heymail-fpm

    volumes:
      - api_fpm_socket:/run/heymail-fpm

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER

    pids_limit: 20
    mem_limit: 32m
    cpus: 0.10


  # =========================================================================
  # HTTPS API gateway
  # =========================================================================

  gateway:
    build:
      context: .
      dockerfile: docker/gateway/Dockerfile
      args:
        HEYMAIL_UID: ${HEYMAIL_UID:?HEYMAIL_UID is required}
        HEYMAIL_GID: ${HEYMAIL_GID:?HEYMAIL_GID is required}

    image: heymail-gateway:local

    restart: unless-stopped

    user: "${HEYMAIL_UID:?HEYMAIL_UID is required}:${HEYMAIL_GID:?HEYMAIL_GID is required}"

    depends_on:
      api:
        condition: service_healthy

      fpm-socket-bootstrap:
        condition: service_completed_successfully

    ports:
      - "127.0.0.1:8443:8443"

    networks:
      - gateway_net

    volumes:
      - api_fpm_socket:/run/heymail-fpm:ro

    secrets:
      - gateway_tls_cert
      - gateway_tls_key

    read_only: true

    tmpfs:
      - /tmp:size=32m,mode=1777

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    pids_limit: 50
    mem_limit: 128m
    cpus: 0.25

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "nginx -t >/dev/null 2>&1 && test -S /run/heymail-fpm/heymail.sock"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s


  # =========================================================================
  # Authoritative DNS laboratory
  #
  # Serves dynamic TXT records used by the sending-domain ownership tests.
  # The service is isolated from the host and all SMTP networks.
  # =========================================================================

  fake-dns:
    build:
      context: .
      dockerfile: docker/dns-lab/Dockerfile

    image: heymail-fake-dns:lab

    restart: unless-stopped

    user: "10003:10003"

    networks:
      - dns_lab_net

    expose:
      - "8053/udp"

    read_only: true

    tmpfs:
      - /tmp:size=8m,mode=1777
      - /records:size=8m,uid=10003,gid=10003,mode=0700

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    pids_limit: 30
    mem_limit: 64m
    cpus: 0.10

    healthcheck:
      test:
        [
          "CMD",
          "php",
          "/usr/local/bin/heymail-fake-dns.php",
          "--healthcheck"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s


  # =========================================================================
  # Postfix SMTP laboratory
  # =========================================================================

  postfix:
    build:
      context: .
      dockerfile: docker/postfix/Dockerfile

    image: heymail-postfix:lab

    restart: unless-stopped

    read_only: true

    networks:
      smtp_lab_net:
      filter_net:
      mail_net:
        aliases:
          - postfix-mail

    depends_on:
      rspamd:
        condition: service_healthy

      fake-mx-success:
        condition: service_healthy

      fake-mx-tempfail:
        condition: service_healthy

      fake-mx-permfail:
        condition: service_healthy

    volumes:
      - postfix_queue:/var/spool/postfix
      - postfix_data:/var/lib/postfix
      - postfix_logs:/var/log/postfix

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    cap_add:
      - SETUID
      - SETGID
      - DAC_OVERRIDE

    pids_limit: 100
    mem_limit: 256m
    cpus: 0.50

    healthcheck:
      test:
        [
          "CMD",
          "/usr/local/bin/heymail-postfix-healthcheck"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

    stop_grace_period: 15s


  # =========================================================================
  # Fake MX - successful delivery
  # =========================================================================

  fake-mx-success:
    build:
      context: .
      dockerfile: docker/smtp-lab/Dockerfile

    image: heymail-fake-mx:lab

    restart: unless-stopped

    environment:
      FAKE_MX_MODE: success
      FAKE_MX_CAPTURE_DIR: /capture

    networks:
      - smtp_lab_net

    expose:
      - "2525"

    read_only: true

    tmpfs:
      - /tmp:size=8m,mode=1777
      - /capture:size=8m,uid=10001,gid=10001,mode=0700

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    pids_limit: 30
    mem_limit: 32m
    cpus: 0.10

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "RESPONSE=\"$$(printf 'QUIT\\r\\n' | socat -T1 - TCP:127.0.0.1:2525,connect-timeout=1 2>/dev/null)\"; printf '%s\\n' \"$$RESPONSE\" | grep -q '^220 '"
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s


  # =========================================================================
  # Fake MX - temporary failure
  # =========================================================================

  fake-mx-tempfail:
    image: heymail-fake-mx:lab

    restart: unless-stopped

    environment:
      FAKE_MX_MODE: tempfail

    networks:
      - smtp_lab_net

    expose:
      - "2525"

    read_only: true

    tmpfs:
      - /tmp:size=8m,mode=1777

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    pids_limit: 30
    mem_limit: 32m
    cpus: 0.10

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "RESPONSE=\"$$(printf 'QUIT\\r\\n' | socat -T1 - TCP:127.0.0.1:2525,connect-timeout=1 2>/dev/null)\"; printf '%s\\n' \"$$RESPONSE\" | grep -q '^220 '"
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s


  # =========================================================================
  # Fake MX - permanent failure
  # =========================================================================

  fake-mx-permfail:
    image: heymail-fake-mx:lab

    restart: unless-stopped

    environment:
      FAKE_MX_MODE: permfail

    networks:
      - smtp_lab_net

    expose:
      - "2525"

    read_only: true

    tmpfs:
      - /tmp:size=8m,mode=1777

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    pids_limit: 30
    mem_limit: 32m
    cpus: 0.10

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "RESPONSE=\"$$(printf 'QUIT\\r\\n' | socat -T1 - TCP:127.0.0.1:2525,connect-timeout=1 2>/dev/null)\"; printf '%s\\n' \"$$RESPONSE\" | grep -q '^220 '"
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s



  # =========================================================================
  # Rspamd DKIM key bootstrap
  # =========================================================================

  rspamd-dkim-bootstrap:
    build:
      context: .
      dockerfile: docker/rspamd/Dockerfile

    image: heymail-rspamd:lab

    restart: "no"

    user: "0:0"

    network_mode: "none"

    read_only: true

    entrypoint:
      - /usr/local/bin/heymail-rspamd-dkim-bootstrap

    command: []

    volumes:
      - rspamd_dkim_private:/private
      - rspamd_dkim_public:/public

    tmpfs:
      - /tmp:size=8m,mode=0700

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    cap_add:
      - CHOWN

    pids_limit: 20
    mem_limit: 128m
    cpus: 0.25


  # =========================================================================
  # Rspamd filtering laboratory
  # =========================================================================

  rspamd:
    build:
      context: .
      dockerfile: docker/rspamd/Dockerfile

    image: heymail-rspamd:lab

    restart: unless-stopped

    user: "100:101"

    read_only: true

    depends_on:
      rspamd-dkim-bootstrap:
        condition: service_completed_successfully

    networks:
      - filter_net

    volumes:
      - rspamd_dkim_private:/run/heymail-dkim:ro

    expose:
      - "11332"

    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/lib/rspamd:size=32m,uid=100,gid=101,mode=0750

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    pids_limit: 50
    mem_limit: 256m
    cpus: 0.50

    healthcheck:
      test:
        [
          "CMD",
          "/usr/local/bin/heymail-rspamd-healthcheck"
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 60s

    stop_grace_period: 15s



  # =========================================================================
  # DKIM cryptographic verification laboratory
  # =========================================================================

  dkim-verifier:
    build:
      context: .
      dockerfile: docker/dkim-verifier/Dockerfile

    image: heymail-dkim-verifier:lab

    restart: "no"

    user: "10002:10002"

    network_mode: "none"

    read_only: true

    environment:
      PYTHONDONTWRITEBYTECODE: "1"

    volumes:
      - rspamd_dkim_public:/public:ro

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    pids_limit: 20
    mem_limit: 128m
    cpus: 0.25

networks:

  gateway_net:
