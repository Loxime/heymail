name: heymail

services:

  # =========================================================================
  # PostgreSQL
  # =========================================================================

  database:
    image: postgres:18.4-alpine3.23@sha256:996d0920e4ff9df1fc19dacb904492f3c1ec0ec1cc338f0ad7123be7731c5f5e

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}

      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password

      POSTGRES_INITDB_ARGS: >-
        --auth-host=scram-sha-256
        --auth-local=scram-sha-256
        --encoding=UTF8
        --locale-provider=builtin
        --builtin-locale=C.UTF-8

    secrets:
      - postgres_password

    volumes:
      - postgres_data:/var/lib/postgresql

    networks:
      - data_net

    expose:
      - "5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

    security_opt:
      - no-new-privileges:true

    read_only: true

    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/run/postgresql:size=16m,mode=3777

    pids_limit: 200
    mem_limit: 768m
    cpus: 1.0

    stop_grace_period: 30s


  # =========================================================================
  # PostgreSQL bootstrap
  #
  # Short-lived provisioning service.
  # It creates/updates the limited application and migration roles.
  # =========================================================================

  database-bootstrap:
    image: postgres:18.4-alpine3.23@sha256:996d0920e4ff9df1fc19dacb904492f3c1ec0ec1cc338f0ad7123be7731c5f5e

    restart: "no"

    user: "${HEYMAIL_UID:?HEYMAIL_UID is required}:${HEYMAIL_GID:?HEYMAIL_GID is required}"

    entrypoint:
      - /bin/sh
      - /opt/heymail/bootstrap-roles.sh

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}

      PGHOST: database
      PGPORT: "5432"

    secrets:
      - postgres_password
      - postgres_app_password
      - postgres_migrator_password

    volumes:
      - ./docker/postgres/bootstrap/bootstrap-roles.sh:/opt/heymail/bootstrap-roles.sh:ro

    networks:
      - data_net

    depends_on:
      database:
        condition: service_healthy

    read_only: true

    tmpfs:
      - /tmp:size=16m,mode=1777

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    pids_limit: 50
    mem_limit: 128m
    cpus: 0.25


  # =========================================================================
  # Symfony API
  # =========================================================================

  api:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        HEYMAIL_UID: ${HEYMAIL_UID:?HEYMAIL_UID is required}
        HEYMAIL_GID: ${HEYMAIL_GID:?HEYMAIL_GID is required}

    image: heymail-api:local

    restart: unless-stopped

    user: "${HEYMAIL_UID:?HEYMAIL_UID is required}:${HEYMAIL_GID:?HEYMAIL_GID is required}"

    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_RUNTIME_OPTIONS: '{"disable_dotenv":true}'
      APP_SECRET_FILE: /run/secrets/app_secret

      DB_HOST: database
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:?POSTGRES_DB is required}
      DB_USER: heymail_app
      DB_PASSWORD_FILE: /run/secrets/postgres_app_password

    secrets:
      - app_secret
      - postgres_app_password

    networks:
      - data_net

    depends_on:
      database:
        condition: service_healthy

      database-bootstrap:
        condition: service_completed_successfully

    read_only: true

    tmpfs:
      - /tmp:size=32m,mode=1777
      - /app/var:size=128m,mode=0770,uid=${HEYMAIL_UID},gid=${HEYMAIL_GID}

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    pids_limit: 100
    mem_limit: 384m
    cpus: 0.50

    healthcheck:
      test:
        [
          "CMD",
          "php",
          "/usr/local/bin/heymail-healthcheck.php"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    stop_grace_period: 15s


  # =========================================================================
  # Postfix SMTP laboratory
  # =========================================================================

  postfix:
    build:
      context: .
      dockerfile: docker/postfix/Dockerfile

    image: heymail-postfix:lab

    restart: unless-stopped

    read_only: true

    networks:
      - smtp_lab_net

    depends_on:
      fake-mx-success:
        condition: service_healthy

      fake-mx-tempfail:
        condition: service_healthy

      fake-mx-permfail:
        condition: service_healthy

    volumes:
      - postfix_queue:/var/spool/postfix
      - postfix_data:/var/lib/postfix

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    cap_add:
      - SETUID
      - SETGID
      - DAC_OVERRIDE

    pids_limit: 100
    mem_limit: 256m
    cpus: 0.50

    healthcheck:
      test:
        [
          "CMD",
          "/usr/local/bin/heymail-postfix-healthcheck"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

    stop_grace_period: 15s


  # =========================================================================
  # Fake MX - successful delivery
  # =========================================================================

  fake-mx-success:
    build:
      context: .
      dockerfile: docker/smtp-lab/Dockerfile

    image: heymail-fake-mx:lab

    restart: unless-stopped

    environment:
      FAKE_MX_MODE: success

    networks:
      - smtp_lab_net

    expose:
      - "2525"

    read_only: true

    tmpfs:
      - /tmp:size=8m,mode=1777

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    pids_limit: 30
    mem_limit: 32m
    cpus: 0.10

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "RESPONSE=\"$$(printf 'QUIT\\r\\n' | socat -T1 - TCP:127.0.0.1:2525,connect-timeout=1 2>/dev/null)\"; printf '%s\\n' \"$$RESPONSE\" | grep -q '^220 '"
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s


  # =========================================================================
  # Fake MX - temporary failure
  # =========================================================================

  fake-mx-tempfail:
    image: heymail-fake-mx:lab

    restart: unless-stopped

    environment:
      FAKE_MX_MODE: tempfail

    networks:
      - smtp_lab_net

    expose:
      - "2525"

    read_only: true

    tmpfs:
      - /tmp:size=8m,mode=1777

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    pids_limit: 30
    mem_limit: 32m
    cpus: 0.10

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "RESPONSE=\"$$(printf 'QUIT\\r\\n' | socat -T1 - TCP:127.0.0.1:2525,connect-timeout=1 2>/dev/null)\"; printf '%s\\n' \"$$RESPONSE\" | grep -q '^220 '"
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s


  # =========================================================================
  # Fake MX - permanent failure
  # =========================================================================

  fake-mx-permfail:
    image: heymail-fake-mx:lab

    restart: unless-stopped

    environment:
      FAKE_MX_MODE: permfail

    networks:
      - smtp_lab_net

    expose:
      - "2525"

    read_only: true

    tmpfs:
      - /tmp:size=8m,mode=1777

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    pids_limit: 30
    mem_limit: 32m
    cpus: 0.10

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "RESPONSE=\"$$(printf 'QUIT\\r\\n' | socat -T1 - TCP:127.0.0.1:2525,connect-timeout=1 2>/dev/null)\"; printf '%s\\n' \"$$RESPONSE\" | grep -q '^220 '"
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s



  # =========================================================================
  # Rspamd DKIM key bootstrap
  # =========================================================================

  rspamd-dkim-bootstrap:
    build:
      context: .
      dockerfile: docker/rspamd/Dockerfile

    image: heymail-rspamd:lab

    restart: "no"

    user: "0:0"

    network_mode: "none"

    read_only: true

    entrypoint:
      - /usr/local/bin/heymail-rspamd-dkim-bootstrap

    command: []

    volumes:
      - rspamd_dkim_private:/private
      - rspamd_dkim_public:/public

    tmpfs:
      - /tmp:size=8m,mode=0700

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    cap_add:
      - CHOWN

    pids_limit: 20
    mem_limit: 128m
    cpus: 0.25


  # =========================================================================
  # Rspamd filtering laboratory
  # =========================================================================

  rspamd:
    build:
      context: .
      dockerfile: docker/rspamd/Dockerfile

    image: heymail-rspamd:lab

    restart: unless-stopped

    user: "100:101"

    read_only: true

    depends_on:
      rspamd-dkim-bootstrap:
        condition: service_completed_successfully

    networks:
      - filter_net

    volumes:
      - rspamd_dkim_private:/run/heymail-dkim:ro

    expose:
      - "11332"

    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/lib/rspamd:size=32m,uid=100,gid=101,mode=0750

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    pids_limit: 50
    mem_limit: 256m
    cpus: 0.50

    healthcheck:
      test:
        [
          "CMD",
          "/usr/local/bin/heymail-rspamd-healthcheck"
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 60s

    stop_grace_period: 15s


networks:

  frontend_net:
    name: heymail_frontend
    driver: bridge

  data_net:
    name: heymail_data
    driver: bridge
    internal: true

  mail_net:
    name: heymail_mail
    driver: bridge
    internal: true

  filter_net:
    name: heymail_filter
    driver: bridge
    internal: true

  smtp_lab_net:
    name: heymail_smtp_lab
    driver: bridge
    internal: true


volumes:

  postgres_data:
    name: heymail_postgres_data

  postfix_queue:
    name: heymail_postfix_queue

  postfix_data:
    name: heymail_postfix_data

  rspamd_dkim_private:
    name: heymail_rspamd_dkim_private

  rspamd_dkim_public:
    name: heymail_rspamd_dkim_public


secrets:

  postgres_password:
    file: ./secrets/postgres_password

  postgres_app_password:
    file: ./secrets/postgres_app_password

  postgres_migrator_password:
    file: ./secrets/postgres_migrator_password

  app_secret:
    file: ./secrets/app_secret
